server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cine-zaror-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${ORACLE_USERNAME:curso}
    password: ${ORACLE_PASSWORD:curso123}
    driver-class-name: oracle.jdbc.OracleDriver
  jdbc:
    template:
      query-timeout: 30

app:
  jwt:
    secret: ${JWT_SECRET:cambiar-este-secreto-en-produccion-minimo-32-caracteres}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    cl.ucm.cinezaror: INFO
    org.springframework.security: INFO
