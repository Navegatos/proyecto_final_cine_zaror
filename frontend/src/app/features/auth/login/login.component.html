<mat-card>
  <mat-card-header><mat-card-title>Iniciar sesión</mat-card-title></mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()" class="form">
      <mat-form-field appearance="outline" class="full">
        <mat-label>Correo</mat-label>
        <input matInput formControlName="correo" type="email" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="full">
        <mat-label>Contraseña</mat-label>
        <input matInput formControlName="password" type="password" />
      </mat-form-field>
      <button mat-raised-button color="primary" type="submit" [disabled]="loading || form.invalid">
        @if (loading) { <mat-spinner diameter="20"></mat-spinner> } @else { Ingresar }
      </button>
    </form>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button routerLink="/registro">Crear cuenta</a>
  </mat-card-actions>
</mat-card>
