@if (reserva) {
  <mat-card>
    <mat-card-header><mat-card-title>Checkout — {{ reserva.codigo }}</mat-card-title></mat-card-header>
    <mat-card-content>
      <p><strong>Película:</strong> {{ reserva.pelicula }}</p>
      <p><strong>Sala:</strong> {{ reserva.sala }}</p>
      <p><strong>Asientos:</strong> {{ reserva.asientos }}</p>
      <p><strong>Total:</strong> ${{ reserva.total | number }}</p>
      <mat-form-field appearance="outline">
        <mat-label>Método de pago</mat-label>
        <mat-select [(value)]="metodo">
          <mat-option value="DEBITO">Débito</mat-option>
          <mat-option value="CREDITO">Crédito</mat-option>
        </mat-select>
      </mat-form-field>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary" (click)="pagar()">Simular pago</button>
    </mat-card-actions>
  </mat-card>
}
