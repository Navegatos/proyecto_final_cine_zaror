<mat-toolbar color="primary">
  <a mat-button routerLink="/cartelera" class="brand">
    <mat-icon>movie</mat-icon>
    Cine Zaror
  </a>

  <span class="spacer"></span>

  <a mat-button routerLink="/cartelera" routerLinkActive="active">Cartelera</a>

  @if (authService.isAuthenticated()) {
    <a mat-button routerLink="/mis-reservas" routerLinkActive="active">Mis reservas</a>
  }

  @if (authService.isAdmin()) {
    <a mat-button routerLink="/admin" routerLinkActive="active">Administración</a>
  }

  @if (authService.isAuthenticated()) {
    <button mat-button type="button" (click)="authService.logout()">
      <mat-icon>logout</mat-icon>
      Salir
    </button>
  } @else {
    <a mat-button routerLink="/login" routerLinkActive="active">Ingresar</a>
    <a mat-button routerLink="/registro" routerLinkActive="active">Registrarse</a>
  }
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
