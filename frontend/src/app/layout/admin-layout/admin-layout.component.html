<mat-sidenav-container class="admin-container">
  <mat-sidenav mode="side" opened class="admin-sidenav">
    <div class="sidenav-header">
      <mat-icon>admin_panel_settings</mat-icon>
      <span>Panel Admin</span>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/admin/peliculas" routerLinkActive="active">
        <mat-icon matListItemIcon>movie</mat-icon>
        <span matListItemTitle>Películas</span>
      </a>
      <a mat-list-item routerLink="/admin/salas" routerLinkActive="active">
        <mat-icon matListItemIcon>meeting_room</mat-icon>
        <span matListItemTitle>Salas</span>
      </a>
      <a mat-list-item routerLink="/admin/funciones" routerLinkActive="active">
        <mat-icon matListItemIcon>schedule</mat-icon>
        <span matListItemTitle>Funciones</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <span>Administración Cine Zaror</span>
      <span class="spacer"></span>
      <a mat-button routerLink="/cartelera">Volver al sitio</a>
      <button mat-button type="button" (click)="authService.logout()">Salir</button>
    </mat-toolbar>

    <main class="admin-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
