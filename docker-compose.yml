# Perfiles disponibles:
#   db       → solo Oracle (contenedor cinezaror-oracle)
#   backend  → solo API Spring Boot
#   frontend → solo Angular (nginx)
#   stack    → los tres servicios juntos
#
# Ejemplos:
#   docker compose --profile db up -d
#   docker compose --profile backend up -d
#   docker compose --profile stack up -d

services:
  oracle:
    profiles: [db, stack]
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: cinezaror-oracle
    ports:
      - "${ORACLE_HOST_PORT:-1522}:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-Oracle123}
      APP_USER: ${ORACLE_USERNAME:-curso}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-curso123}
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  backend:
    profiles: [backend, stack]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cinezaror-backend
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      ORACLE_URL: ${ORACLE_URL:-jdbc:oracle:thin:@//oracle:1521/XEPDB1}
      ORACLE_USERNAME: ${ORACLE_USERNAME:-curso}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-curso123}
      JWT_SECRET: ${JWT_SECRET:-cambiar-este-secreto-en-produccion-minimo-32-caracteres}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      oracle:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  frontend:
    profiles: [frontend, stack]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cinezaror-frontend
    ports:
      - "${FRONTEND_HOST_PORT:-4200}:80"
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-backend:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  oracle_data:
